name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Windows/**"
      - "Resources/Bible/**"
      - "BibleVerseReplacer.sln"
      - "README.md"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    name: Windows .NET Framework 4.8
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild BibleVerseReplacer.sln /restore /p:Configuration=Release /p:Platform="Any CPU"

      - name: Self test
        shell: pwsh
        run: |
          & .\Windows\BibleVerseReplacer.Windows\bin\Release\BibleVerseReplacer.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $version = "0.1.0"
          $publish = "dist\windows\BibleVerseReplacer"
          New-Item -ItemType Directory -Force -Path $publish | Out-Null
          Copy-Item Windows\BibleVerseReplacer.Windows\bin\Release\BibleVerseReplacer.exe $publish\
          Copy-Item Windows\BibleVerseReplacer.Windows\bin\Release\BibleVerseReplacer.exe.config $publish\
          Copy-Item -Recurse Windows\BibleVerseReplacer.Windows\bin\Release\Resources $publish\
          Compress-Archive -Path $publish -DestinationPath "dist\BibleVerseReplacer-Windows-v$version.zip" -Force
          Get-FileHash "dist\BibleVerseReplacer-Windows-v$version.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  BibleVerseReplacer-Windows-v$version.zip" } |
            Set-Content -Encoding ASCII "dist\BibleVerseReplacer-Windows-v$version-SHA256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerseReplacer-Windows-v0.1.0
          path: |
            dist/BibleVerseReplacer-Windows-v0.1.0.zip
            dist/BibleVerseReplacer-Windows-v0.1.0-SHA256.txt
